name: Deploy GOS to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'dishes/**'
      - 'ingredients/**'
      - 'tips/**'
      - 'scripts/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-pages-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          npm_config_ignore_scripts: "true"
        working-directory: ./site

      - name: Generate content (recipes, API, graph)
        working-directory: ./site
        run: |
          node scripts/copy-content.js
          node scripts/generate-api.js
          node scripts/generate-catalog.js
          node scripts/enrich-ingredients.js
          node scripts/generate-graph.js
          node scripts/export-vectors.mjs
          node scripts/generate-llms.mjs

      - name: Build Astro site
        working-directory: ./site
        run: pnpm exec astro build

      - name: ⚡ Deploy to Cloudflare Pages (wrangler-action, patrón canónico worldexams/gara-g)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "site"
          command: pages deploy dist --project-name=gos-site --branch=main --commit-dirty=true
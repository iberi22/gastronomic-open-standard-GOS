name: Sync Labels

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  issues: write

# Serialize runs: two pushes within seconds (e.g. #369 + #370 on
# 2026-10-13) raced to delete the same stale label and the loser failed
# with `Cannot delete "workflow" label: Not Found`.
concurrency:
  group: sync-labels
  cancel-in-progress: false

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync labels
        uses: crazy-max/ghaction-github-labeler@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yml
          exclude: |
            needs-human
            high-stakes
            quarantine

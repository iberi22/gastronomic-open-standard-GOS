name: Continuous Integration

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: npm run lint

  gos-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install GOS Framework
        run: |
          pip install pydantic pyyaml click
          pip install -e .
      - name: Run Scientific Audit
        run: python -m gos.cli audit

  build-graph:
    runs-on: ubuntu-latest
    needs: [gos-audit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: pip install pyyaml
      - name: Build Knowledge Graph
        run: python scripts/build_graph.py
      - name: Upload Graph Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: knowledge-graph
          path: docs/explorar-grafo.html

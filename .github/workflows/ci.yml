name: Continuous Integration

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
        env:
          npm_config_ignore_scripts: "true"
      - run: pnpm run lint

  astro-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
        env:
          npm_config_ignore_scripts: "true"
      - name: Generate Knowledge Graph Artifact
        run: node scripts/generate-graph.js
        working-directory: ./site
      - run: pnpm --filter gos-site exec astro check

  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
        env:
          npm_config_ignore_scripts: "true"
      - name: Generate Knowledge Graph Artifact
        run: node scripts/generate-graph.js
        working-directory: ./site
      # TODO(wave-C.05): python3 scripts/audit_content.py --check
      - run: pnpm --filter gos-site test

  # Tests del gateway de agentes.
  #
  # Este job no existia y su ausencia era el agujero por el que volvio el
  # bypass de autenticacion: deploy-worker.yml despliega en cada push a
  # worker/** y nunca ejecutaba estos tests, asi que un cambio que
  # reintrodujera el fallback por substring habria llegado a produccion
  # sin que nadie lo notara. Los 54 tests de worker/test/ son lo unico que
  # detecta esa regresion.
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install worker dependencies
        working-directory: ./worker
        run: npm install --no-audit --no-fund
        env:
          # ningun lifecycle script corre en el worker
          npm_config_ignore_scripts: 'true'
      - name: Typecheck
        working-directory: ./worker
        run: npm run typecheck
      - name: Tests
        working-directory: ./worker
        run: npm test

  # Gate de evidencia: cada DOI debe CORRESPONDER al articulo que el archivo
  # declara, no solo resolver. Se hallaron 22 DOI que resolvian a otro articulo
  # del mismo numero por coincidencia de revista+anio. Falla mientras queden.
  #
  # El job lleva los dos controles que le faltaban: sin control negativo un
  # gate nunca visto fallar es decorado. verify-dois.py commiteado una vez con
  # norm() roto (N-01) y nadie lo noto hasta la auditoria.
  #   1. --self-test           offline: norm(), coincide() y exit codes con fixtures
  #   2. --negative-control    con Crossref real: DOI falseado -> rc 1
  verify-dois:
    name: evidence (DOI corresponde al artículo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar PyYAML (sin ella el gate no puede leer el frontmatter)
        run: python3 -m pip install --quiet pyyaml
      - name: Control negativo offline (norm, coincide, exit codes)
        working-directory: site
        run: python3 scripts/verify-dois.py --self-test
      - name: Verificar DOI contra Crossref (control positivo)
        working-directory: site
        run: |
          python3 scripts/verify-dois.py | tee /tmp/dois.txt
          # Un DOI publicado debe seguir saliendo OK: si esto falta, el gate
          # rompe TODO y deja de distinguir un DOI bueno de uno falso.
          grep -E '^OK[[:space:]].*quercetina\.md' /tmp/dois.txt
      - name: Control negativo end-to-end (DOI falseado -> rc 1)
        working-directory: site
        run: python3 scripts/verify-dois.py --negative-control

  # Gate de evidencia: todo evidence_level debe ser High, Medium o Low.
  # Antes de este gate, 43 de 175 estaban fuera de rango (texto libre en
  # espanol) y 5 eran bloques multilinea que ninguna pagina podia leer como
  # valor. Falla si vuelve a colarse uno.
  verify-evidence:
    name: evidence (nivel High/Medium/Low)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar evidence_level
        working-directory: site
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/verify-evidence.py

  gos-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install GOS Framework
        run: |
          pip install pydantic pyyaml click
          pip install -e .
      - name: Run Scientific Audit
        run: python -m gos.cli audit

  build-graph:
    runs-on: ubuntu-latest
    needs: [astro-check, vitest, gos-audit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: pip install pyyaml
      - name: Build Knowledge Graph
        run: python scripts/build_graph.py
      - name: Upload Graph Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: knowledge-graph
          path: docs/explorar-grafo.html

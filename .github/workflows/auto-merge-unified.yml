# Auto-Merge Workflow (Unified)
# Consolidates: auto-merge.yml, auto-merge-pr.yml, dependabot-auto-merge.yml

name: Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to evaluate for auto-merge'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]') ||
      (github.event_name == 'check_suite' && github.event.check_suite.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Get PR Number
        id: pr
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "check_suite" ]; then
            PR=$(gh pr list --head "${{ github.event.check_suite.head_branch }}" --json number --jq '.[0].number' --repo ${{ github.repository }})
            echo "number=$PR" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "pull_request_review" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check PR Status
        id: check
        if: steps.pr.outputs.number != ''
        run: |
          PR_DATA=$(gh pr view ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} --json mergeable,mergeStateStatus,reviewDecision,statusCheckRollup)
          
          # GitHub devuelve mergeable=UNKNOWN mientras recalcula tras el ultimo
          # push. Reintentar un momento evita descartar el PR por un dato que
          # aun no esta listo.
          for i in 1 2 3 4 5; do
            MERGEABLE=$(echo "$PR_DATA" | jq -r '.mergeable')
            [ "$MERGEABLE" != "UNKNOWN" ] && break
            sleep 10
            PR_DATA=$(gh pr view ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} --json mergeable,mergeStateStatus,reviewDecision,statusCheckRollup)
          done

          MERGE_STATE=$(echo "$PR_DATA" | jq -r '.mergeStateStatus')
          REVIEW_DECISION=$(echo "$PR_DATA" | jq -r '.reviewDecision // "NONE"')

          # Solo cuentan como fallo los checks realmente rojos. SKIPPED no es
          # un fallo (este propio job entra como SKIPPED mientras decide), y
          # PENDING/None tampoco: si se mergeara aqui, un check que aun no ha
          # reportado contaria como OK.
          FAILED=$(echo "$PR_DATA" | jq '[.statusCheckRollup[] | select(.conclusion == "FAILURE" or .conclusion == "CANCELLED" or .conclusion == "TIMED_OUT" or .conclusion == "ACTION_REQUIRED" or .conclusion == "STARTUP_FAILURE")] | length')
          PENDING=$(echo "$PR_DATA" | jq '[.statusCheckRollup[] | select(.conclusion == null and .state == "PENDING")] | length')

          echo "mergeable=$MERGEABLE" >> $GITHUB_OUTPUT
          echo "merge_state=$MERGE_STATE" >> $GITHUB_OUTPUT
          echo "review_decision=$REVIEW_DECISION" >> $GITHUB_OUTPUT
          echo "failed_checks=$FAILED" >> $GITHUB_OUTPUT
          echo "pending_checks=$PENDING" >> $GITHUB_OUTPUT

          # Auto-merge si: mergeable, CI verde, nada pendiente y sin bloqueo.
          # El ruleset "main" ya no exige approving review (solo deletion y
          # non_fast_forward), así que reviewDecision queda como informativo:
          # exigir APPROVED aqui dejaba los PRs parados sin revision posible,
          # porque GitHub no aprueba PRs del propio autor.
          if [ "$MERGEABLE" == "MERGEABLE" ] && [ "$FAILED" == "0" ] && [ "$PENDING" == "0" ] && [ "$MERGE_STATE" != "BLOCKED" ]; then
            echo "should_merge=true" >> $GITHUB_OUTPUT
          else
            echo "should_merge=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Auto-Merge PR
        if: steps.check.outputs.should_merge == 'true'
        run: |
          gh pr merge ${{ steps.pr.outputs.number }} \
            --repo ${{ github.repository }} \
            --squash \
            --auto \
            --delete-branch
          
          echo "✅ PR #${{ steps.pr.outputs.number }} set to auto-merge"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Log Decision
        if: steps.check.outputs.should_merge == 'false'
        run: |
          echo "❌ PR #${{ steps.pr.outputs.number }} not ready for auto-merge:"
          echo "  - Mergeable: ${{ steps.check.outputs.mergeable }}"
          echo "  - Review Decision: ${{ steps.check.outputs.review_decision }}"
          echo "  - Failed Checks: ${{ steps.check.outputs.failed_checks }}"

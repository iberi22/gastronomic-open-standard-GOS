name: Protocol Feedback

# This workflow collects improvements and issues encountered with Git-Core Protocol
# and reports them upstream to iberi22/GitCore repository

on:
  workflow_dispatch:
    inputs:
      feedback_type:
        description: 'Type of feedback'
        required: true
        type: choice
        options:
          - bug
          - enhancement
          - documentation
          - question
      title:
        description: 'Issue title'
        required: true
        type: string
      description:
        description: 'Detailed description'
        required: true
        type: string
      priority:
        description: 'Priority level'
        required: false
        type: choice
        default: 'medium'
        options:
          - low
          - medium
          - high
          - critical

  schedule:
    # Weekly automatic collection of protocol issues (Sundays at 00:00 UTC)
    - cron: '0 0 * * 0'

permissions:
  contents: read
  issues: write

jobs:
  collect-feedback:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for Protocol Issues
        id: scan
        run: |
          echo "Scanning for protocol-related issues..."
          
          # Look for issues labeled with 'protocol-improvement'
          ISSUES=$(gh issue list \
            --repo ${{ github.repository }} \
            --label "protocol-improvement" \
            --state open \
            --json number,title,body,labels \
            --limit 10)
          
          echo "Found $(echo "$ISSUES" | jq length) protocol issues"
          echo "issues=$ISSUES" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Weekly Summary
        if: steps.scan.outputs.issues != '[]'
        run: |
          cat > protocol-feedback.md << 'EOF'
          ## 📊 Weekly Protocol Feedback Summary
          
          **Project:** ${{ github.repository }}
          **Period:** $(date -d '7 days ago' '+%Y-%m-%d') to $(date '+%Y-%m-%d')
          **Protocol Version:** $(cat .git-core-protocol-version || echo "unknown")
          
          ### Issues Encountered
          
          EOF
          
          echo '${{ steps.scan.outputs.issues }}' | jq -r '.[] | "- **#\(.number)**: \(.title)\n  \(.body | split("\n")[0])\n"' >> protocol-feedback.md
          
          cat protocol-feedback.md

      - name: Report to Protocol Repo
        if: steps.scan.outputs.issues != '[]'
        run: |
          gh issue create \
            --repo iberi22/GitCore \
            --title "📋 Weekly Feedback from ${{ github.repository }}" \
            --body-file protocol-feedback.md \
            --label "feedback,from-field"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_PROTOCOL || secrets.GITHUB_TOKEN }}

  manual-feedback:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Protocol Version
        id: version
        run: |
          VERSION=$(cat .git-core-protocol-version || echo "unknown")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Protocol Issue
        run: |
          LABELS="${{ github.event.inputs.feedback_type }}"
          
          if [ "${{ github.event.inputs.priority }}" = "high" ] || [ "${{ github.event.inputs.priority }}" = "critical" ]; then
            LABELS="$LABELS,priority-${{ github.event.inputs.priority }}"
          fi
          
          # Add 'feedback' label (exists in GitCore repo)
          LABELS="$LABELS,feedback"
          
          cat > issue-body.md << 'EOF'
          ## 🔍 Context
          
          **Project:** ${{ github.repository }}
          **Protocol Version:** ${{ steps.version.outputs.version }}
          **Feedback Type:** ${{ github.event.inputs.feedback_type }}
          **Priority:** ${{ github.event.inputs.priority }}
          **Reported:** $(date '+%Y-%m-%d %H:%M:%S UTC')
          
          ---
          
          ## 📝 Description
          
          ${{ github.event.inputs.description }}
          
          ---
          
          ## 📎 Additional Information
          
          - Repository: https://github.com/${{ github.repository }}
          - Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          ---
          
          *Reported via Protocol Feedback Workflow*
          EOF
          
          gh issue create \
            --repo iberi22/GitCore \
            --title "${{ github.event.inputs.title }}" \
            --body-file issue-body.md \
            --label "$LABELS" || \
          gh issue create \
            --repo iberi22/GitCore \
            --title "${{ github.event.inputs.title }}" \
            --body-file issue-body.md
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_PROTOCOL || secrets.GITHUB_TOKEN }}

      - name: Comment on Success
        if: success()
        run: |
          echo "✅ Feedback successfully reported to iberi22/GitCore"
          echo "📋 View all protocol issues: https://github.com/iberi22/GitCore/issues"

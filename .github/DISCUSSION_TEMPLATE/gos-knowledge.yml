title: "[gos-knowledge] {{ title }}"
labels: ["gos"]
body:
  - type: markdown
    attributes:
      value: "## GOS — Substance / Ingredient / Recipe knowledge share"
  - type: input
    id: topic
    attributes:
      label: "Sustancia / Ingrediente / Receta"
      placeholder: "ej. Alicina — C6H10OS2 — ajo"
      description: "Slug o URL relacionada (ej. /substances/alicina)"
    validations:
      required: true
  - type: textarea
    id: viewpoint
    attributes:
      label: "Punto de vista / aporte"
      description: "Qué descubriste, cómo usas el sazón/sabor/textura, referencia PubMed/DOI"
      placeholder: "La alicina se degrada >70°C, truco: triturar y reposar 10 min..."
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: "Fuente (PubMed, DOI, NIH)"
      placeholder: "10.1186/1471-2261-8-13"
  - type: checkboxes
    id: sharing
    attributes:
      label: "Compartir"
      options:
        - label: "Permitir que este punto de vista se cite en la enciclopedia GOS (atribuido)"
          required: false

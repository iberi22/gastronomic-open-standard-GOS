# Grouped monthly Dependabot configuration (SWAL wave pi-1, S7).
# One pull request per ecosystem per month instead of one PR per bump.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # One grouped PR per ecosystem instead of one per bump.
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    # Deferred majors (2026-10-13 integration PR chore/deps-2026-10-13):
    # - typescript 5.9 -> 7.0 breaks `astro check` ("astro check does not
    #   currently support TypeScript 7.0") and violates @astrojs/svelte
    #   peer range (^5 || ^6). Revisit when Astro supports TS7.
    # - sigma 3.0.3 -> 4.0.0 needs runtime/visual verification of the
    #   Sigma graph renderers (GraphExplorer.astro, GosGraph.svelte).
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sigma"
        update-types: ["version-update:semver-major"]
    groups:
      # Version updates: everything into a single PR.
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      # Security updates keep their own single PR so an
      # advisory patch is never buried in a monthly batch.
      security-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/packages/gos-client"

name = "gos-api-gateway"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# El origen debe ser el dominio CANONICO. Con el host de Pages aqui, el
# gateway servia gos-site.pages.dev, que ya no es el sitio publicado: todo
# canonical/og:url que emitia el proxy apuntaba al host viejo.
ORIGIN_URL = "https://gos.swal.network"
FREE_DAILY_LIMIT = "100"
# Billing central SWAL (opcional; sin esto rige legacy D1+free).
# BILLING_URL = "https://swal-billing.<tu-cuenta>.workers.dev"
# SERVICE_SHARED_SECRET va por secreto, nunca aquí:
#   wrangler secret put SERVICE_SHARED_SECRET

# Sin KV: el namespace compartido 9aef... (SWAL_KV del sitio) superaba las
# 1000 escrituras/dia del free tier. Todo el limitado va por Rate Limiting
# bindings (sin cuota de KV/D1) y la cuota diaria free por un UPSERT en D1.
# namespace_id: entero propio de esta cuenta, unico por limiter.
[[ratelimits]]
name = "RL_FREE_BURST"
namespace_id = "7101"
simple = { limit = 30, period = 60 }

# Compuerta de intentos con key (por IP y por prefijo de key) antes de D1.
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "7102"
simple = { limit = 20, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "gos-billing"
database_id = "1c920534-54fc-449e-b944-180bf96ffe37"

[ai]
binding = "AI"

name = "gos-api-gateway"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# El origen debe ser el dominio CANONICO. Con el host de Pages aqui, el
# gateway servia gos-site.pages.dev, que ya no es el sitio publicado: todo
# canonical/og:url que emitia el proxy apuntaba al host viejo.
ORIGIN_URL = "https://gos.swal.network"

# Sin KV ni D1: el gateway no tiene base de datos (decision del owner,
# 2026-10-21). El unico limite anonimo es la rafaga por IP (30/60 s) sobre el
# Rate Limiting binding. namespace_id: entero propio de esta cuenta, unico por
# limiter.
[[ratelimits]]
name = "RL_FREE_BURST"
namespace_id = "7101"
simple = { limit = 30, period = 60 }

# Eliminado el 2026-10-15 junto con el resto del cobro:
#   [ai] binding = "AI"           -> sin inferencia; /api/ai/infer responde 404
#   [[ratelimits]] RL_AUTH         -> solo existia para throttlear intentos de key
#   BILLING_URL / SERVICE_SHARED_SECRET -> sin keys no hay nada que validar
# Eliminados el 2026-10-21: binding D1 "DB" (gos-billing) y la cuota diaria.
# La base D1 NO se borra desde el repo; la retira el owner en Cloudflare.
# El esquema historico vive en worker/legacy/schema.sql (no desplegado).

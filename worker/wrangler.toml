name = "gos-api-gateway"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# El origen debe ser el dominio CANONICO. Con el host de Pages aqui, el
# gateway servia gos-site.pages.dev, que ya no es el sitio publicado: todo
# canonical/og:url que emitia el proxy apuntaba al host viejo.
ORIGIN_URL = "https://gos.swal.network"
FREE_DAILY_LIMIT = "100"
# Billing central SWAL (opcional; sin esto rige legacy D1+free).
# BILLING_URL = "https://swal-billing.<tu-cuenta>.workers.dev"
# SERVICE_SHARED_SECRET va por secreto, nunca aquí:
#   wrangler secret put SERVICE_SHARED_SECRET

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "9aef690dde244d51982f2947dba2d7aa"

[[d1_databases]]
binding = "DB"
database_name = "gos-billing"
database_id = "1c920534-54fc-449e-b944-180bf96ffe37"

[ai]
binding = "AI"

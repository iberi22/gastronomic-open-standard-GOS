<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      width: 320px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #fff;
      padding: 16px;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2a2a3e;
    }
    
    .header img {
      width: 32px;
      height: 32px;
    }
    
    .header h1 {
      font-size: 16px;
      color: #e94560;
    }
    
    .status {
      padding: 12px;
      background: #1a1a2e;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    
    .status-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    
    .status-value {
      font-size: 14px;
      color: #fff;
    }
    
    .status-value.success { color: #4caf50; }
    .status-value.warning { color: #ff9800; }
    .status-value.info { color: #2196f3; }
    
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #e94560;
      color: #fff;
    }
    
    .btn-primary:hover {
      background: #d63d56;
    }
    
    .btn-secondary {
      background: #2a2a3e;
      color: #c0c0e0;
    }
    
    .btn-secondary:hover {
      background: #3a3a4e;
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .info {
      margin-top: 12px;
      padding: 12px;
      background: #12121a;
      border-radius: 8px;
      font-size: 12px;
      color: #888;
    }
    
    .info strong {
      color: #e94560;
    }
    
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    
    .stat {
      background: #1a1a2e;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    
    .stat-value {
      font-size: 20px;
      color: #e94560;
      font-weight: bold;
    }
    
    .stat-label {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="GOS">
    <h1>GOS Scraper</h1>
  </div>
  
  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="places-count">0</div>
      <div class="stat-label">Lugares</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="reviews-count">0</div>
      <div class="stat-label">Reviews</div>
    </div>
  </div>
  
  <div class="status">
    <div class="status-label">Página Actual</div>
    <div class="status-value" id="page-status">Esperando...</div>
  </div>
  
  <div class="actions">
    <button class="btn btn-primary" id="scrape-btn">Extraer Datos</button>
    <button class="btn btn-secondary" id="view-btn">Ver en GOS App</button>
    <button class="btn btn-secondary" id="export-btn">Exportar JSON</button>
  </div>
  
  <div class="info">
    <strong>Tip:</strong> Esta extensión extrae solo datos <strong>visibles públicamente</strong> en la página. No viola términos de servicio.
  </div>
  
  <script src="popup.js"></script>
</body>
</html>

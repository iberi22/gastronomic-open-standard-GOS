[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gos"
version = "2.0.0"
description = "Gastronomic Open Standard - AI-ready recipe framework"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "click>=8.0.0",
]

[project.scripts]
gos = "gos.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gos*"]

[tool.pytest.ini_options]
# Sin esto pytest recolecta scripts/test_*.py, que no son tests: son scripts
# manuales del fork HowToCook con rutas absolutas "E:/scripts-python/..." de
# un portatil Windows, que fallan en collection con FileNotFoundError.
# testpaths deja la sesion en 9 tests recolectados en vez de abortar.
#
# Los dos modulos listados fallan por causas reales, no por la config:
#   - test_graph_edges.py exige site/graph-data.json, artefacto generado
#     que no existe en un checkout limpio (CI lo genera antes).
#   - test_gos_compliance.py usa separadores de Windows en sus rutas.
# CI no corre pytest: usa vitest (site + worker) y `python -m gos.cli audit`.
testpaths = [
    "automation/test_graph_edges.py",
    "scripts/test_gos_compliance.py",
]

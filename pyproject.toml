[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gos"
version = "2.0.0"
description = "Gastronomic Open Standard - AI-ready recipe framework"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.14.1",
    "pyyaml>=6.0.0",
    "click>=8.0.0",
]

[project.scripts]
gos = "gos.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gos*"]

[tool.pytest.ini_options]
# Sin esto pytest recolecta scripts/test_*.py, que no son tests: son scripts
# manuales del fork HowToCook con rutas absolutas "E:/scripts-python/..." de
# un portatil Windows, que fallan en collection con FileNotFoundError.
# testpaths deja la sesion en 9 tests recolectados en vez de abortar.
#
# Los dos modulos listados pasan cuando se cumplen sus condiciones:
#   - automation/test_graph_edges.py omite sus 8 tests (con skipif needs_graph)
#     en un checkout limpio porque falta site/graph-data.json, y pasan cuando
#     se ejecuta site/scripts/generate-graph.js antes.
#   - scripts/test_gos_compliance.py usa Path(...) para rutas portables.
testpaths = [
    "automation/test_graph_edges.py",
    "scripts/test_gos_compliance.py",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gos"
version = "2.0.0"
description = "Gastronomic Open Standard - AI-ready recipe framework"
requires-python = ">=3.10"
dependencies = ["pydantic", "pyyaml", "click"]

[project.scripts]
gos = "gos.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gos*"]

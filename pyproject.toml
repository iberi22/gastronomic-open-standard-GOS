[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gos"
version = "2.0.0"
description = "Gastronomic Open Standard - AI-ready recipe framework"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "click>=8.0.0",
]

[project.scripts]
gos = "gos.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gos*"]

[tool.pytest.ini_options]
# Solo rutas con tests reales de pytest. scripts/ contiene scripts manuales
# (test_gemini, test_qwen, test_translate...) que fallan en collection con
# FileNotFoundError por rutas absolutas "E:/..." del portatil de un
# desarrollador de Windows; no son tests y pytest los recolectaba igual.
# CI corre los tests de verdad por su cuenta (vitest + worker vitest +
# python -m gos.cli audit), no con pytest.
testpaths = [
    "automation/test_graph_edges.py",
    "scripts/test_gos_compliance.py",
]

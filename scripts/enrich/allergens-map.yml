# EU-14 allergen map (reviewed, hand-curated). Used by scripts/enrich/allergens.py.
# Category keys follow Regulation (EU) 1169/2011 Annex II:
#   celery, cereals_gluten, crustaceans, eggs, fish, lupin, milk, molluscs,
#   mustard, tree_nuts, peanuts, sesame, soybeans, sulphites
# Not a numeric dataset: no nutrient values live here. Rules are matched on
# normalised text (lowercase, accents removed, punctuation -> space, whole words).
# Resolution order for an ingredient:
#   1. slug_overrides (exact slug)          -> fixed list (first match)
#   2. phrase_overrides (whole phrase)      -> fixed list (first match, list order)
#   3. keywords per category (union)        -> if any match
#   4. none_keywords (reviewed no-EU-14)    -> []
#   5. group_defaults[group]                -> list, or null = unknown
#   6. otherwise                            -> ['unknown'] (never implied 'none')
# 'unknown' is written explicitly so that an unreviewed item is never read as allergen-free.

categories:
  - celery
  - cereals_gluten
  - crustaceans
  - eggs
  - fish
  - lupin
  - milk
  - molluscs
  - mustard
  - tree_nuts
  - peanuts
  - sesame
  - soybeans
  - sulphites

slug_overrides:
  emu_oyster_raw: []            # meat cut (testicle), not a mollusc
  ostrich_oyster_raw: []        # meat cut, not a mollusc
  nuts_coconut_meat_raw: []     # coconut is not in the EU-14 nut list
  mustard_greens_raw: []        # leafy vegetable, not mustard seed/prepared mustard
  mustard_spinach_tendergreen_raw: []
  salsa_soya: [cereals_gluten, soybeans]  # brewed soy sauce usually contains wheat
  nuts_acorns_raw: null         # not reviewed -> unknown
  seeds_lotus_seeds_raw: null


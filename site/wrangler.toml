name = "gos-site"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# GitHub Pages base: /gastronomic-open-standard-GOS -> keep for Cloudflare Pages as well
# When deploying to Cloudflare Pages, set base to "/" in astro.config if needed

# Billing/AI-credit bindings (SWAL_D1 "gos-billing", SWAL_KV, [ai]) were removed
# on 2026-10-15: membership is global and the AI quota belongs to the platform.

[vars]
NODE_VERSION = "20"
